name: Web Preview

# Label a PR `preview:web` to get a hosted-web preview on its own workers.dev
# hostname for that push and every subsequent push. The worker name is
# e6code-web-pr-<number>, so latest and nightly custom domains are never
# touched.
#
# The build intentionally omits the E6 Connect cloud config (Clerk keys, relay
# URL): previews boot as the hosted-static app with manual pairing only. Pair a
# server into a preview with `e6 pair --tailscale` (or any reachable HTTPS
# backend) and open the pairing URL against the preview origin.
#
# The preview must be opened at the exact deployment URL from the PR comment.
# Vite bakes that URL in as the hosted origin, and `isHostedStaticApp` matches
# on origin, so any other hostname will not self-identify as the hosted app.
# The workers.dev subdomain is read before the build so the baked origin and
# the deployed hostname are the same URL.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web preview
    # Same-repo PRs only: fork PRs do not receive the Cloudflare secret, and this
    # workflow should skip rather than fail for them. On `labeled` events, only
    # the preview label itself triggers a deploy.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@e6tools/scripts...
              - --filter=@e6tools/web...

      - id: deploy
        name: Deploy preview
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Refusing to deploy a preview without a numeric pull request number." >&2
            exit 1
          fi

          subdomain="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | node -e 'let raw = ""; process.stdin.on("data", (chunk) => { raw += chunk; }); process.stdin.on("end", () => { const body = JSON.parse(raw); const subdomain = body.result && body.result.subdomain; if (!body.success || typeof subdomain !== "string" || subdomain.length === 0) { console.error(body.errors || body); process.exit(1); } process.stdout.write(subdomain); });'
          )"
          if [[ -z "$subdomain" || "$subdomain" == "null" ]]; then
            echo "This Cloudflare account has no workers.dev subdomain." >&2
            exit 1
          fi

          worker_name="e6code-web-pr-${PR_NUMBER}"
          deployment_url="https://${worker_name}.${subdomain}.workers.dev"

          # No VITE_HOSTED_APP_CHANNEL: the About track selector would leave
          # this preview for a production channel host. Production icons still
          # match a stable-looking preview.
          echo "Building preview ${deployment_url}."
          VITE_HOSTED_APP_URL="$deployment_url" \
            vp run --filter @e6tools/web build
          node ../../scripts/apply-web-brand-assets.ts --channel latest

          WORKER_NAME="$worker_name" node --input-type=module -e '
            import * as NodeFS from "node:fs";
            NodeFS.writeFileSync("wrangler.preview.jsonc", JSON.stringify({
              name: process.env.WORKER_NAME,
              compatibility_date: "2026-10-02",
              workers_dev: true,
              preview_urls: false,
              assets: {
                directory: "./dist",
                not_found_handling: "single-page-application",
              },
            }, null, 2) + "\n");
          '

          vp dlx wrangler@4.147.0 deploy --config wrangler.preview.jsonc
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- web-preview-deploy -->";
            const body = [
              marker,
              "### Web preview",
              "",
              `${process.env.DEPLOYMENT_URL} (for ${process.env.HEAD_SHA.slice(0, 7)})`,
              "",
              "Open this exact URL — the hosted-app origin is baked in at build time.",
              "Pair a server into it with `e6 pair --tailscale`, or paste a host + pairing",
              "code under Settings → Connections.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

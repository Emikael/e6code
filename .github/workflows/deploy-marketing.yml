name: Deploy Marketing

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy e6code.com
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://e6code.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install marketing dependencies
        run: vp install --frozen-lockfile --filter=@e6tools/marketing...

      - name: Build marketing site
        run: vp run --filter @e6tools/marketing build

      - name: Deploy marketing site
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment.' >&2
            exit 1
          fi
          vp exec wrangler deploy --dry-run
          vp exec wrangler deploy
          echo 'Deployed marketing site to https://e6code.com' >> "$GITHUB_STEP_SUMMARY"

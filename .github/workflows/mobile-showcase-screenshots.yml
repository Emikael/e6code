name: Mobile Showcase Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Device platforms to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      appearance:
        description: System appearances to capture
        required: true
        default: both
        type: choice
        options:
          - both
          - dark
          - light
      theme:
        description: Palette to capture (all multiplies the run by six)
        required: true
        default: e6-code
        type: choice
        options:
          - e6-code
          - e6-chat
          - grove
          - ocean
          - ember
          - iris
          - all

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  ios:
    name: iPhone 6.9, iPhone 6.5, and iPad 13
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: blacksmith-12vcpu-macos-26
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 60 }}
    env:
      SHOWCASE_APPEARANCE: ${{ inputs.appearance }}
      SHOWCASE_THEME: ${{ inputs.theme }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@e6tools/mobile...
              - --filter=@e6tools/scripts...
              - --filter=e6...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          # Vite+ may use the split XDG layout rather than ~/.vite-plus; ask vp where its data dir is.
          vp_data_dir="$(VP_DUMP_DIRS=1 vp | awk -F '\t' '$1 == "data" { print $2 }')"
          vp_pnpm_bin="$vp_data_dir/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Capture iOS showcase
        run: |
          case "$SHOWCASE_APPEARANCE" in
            both|dark|light) ;;
            *) echo "::error::appearance must be both, dark, or light" >&2; exit 1 ;;
          esac
          case "$SHOWCASE_THEME" in
            e6-code|e6-chat|grove|ocean|ember|iris|all) ;;
            *) echo "::error::theme is not a showcase palette" >&2; exit 1 ;;
          esac
          pnpm screenshots:mobile --platform ios --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME"

      - name: Validate App Store Connect assets
        run: pnpm screenshots:mobile --platform ios --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 60 }}
    env:
      E6_SHOWCASE_ANDROID_ABI: x86_64
      SHOWCASE_APPEARANCE: ${{ inputs.appearance }}
      SHOWCASE_THEME: ${{ inputs.theme }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@e6tools/mobile...
              - --filter=@e6tools/scripts...
              - --filter=e6...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          # Vite+ may use the split XDG layout rather than ~/.vite-plus; ask vp where its data dir is.
          vp_data_dir="$(VP_DUMP_DIRS=1 vp | awk -F '\t' '$1 == "data" { print $2 }')"
          vp_pnpm_bin="$vp_data_dir/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 8
          ram-size: 4096M
          disable-animations: false
          script: |
            case "$SHOWCASE_APPEARANCE" in
              both|dark|light) ;;
              *) echo "::error::appearance must be both, dark, or light" >&2; exit 1 ;;
            esac
            case "$SHOWCASE_THEME" in
              e6-code|e6-chat|grove|ocean|ember|iris|all) ;;
              *) echo "::error::theme is not a showcase palette" >&2; exit 1 ;;
            esac
            pnpm screenshots:mobile --platform android --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME"

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
